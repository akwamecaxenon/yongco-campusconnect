{% extends "base.html" %}

{% block content %}
<h2>Welcome, {{ user.first_name|default:user.username }}!</h2>
<ul>
    <li>Role: {{ user.role }}</li>
    <li>Course: {{ user.course }}</li>
    <li>Total Members: {{ member_count }}</li>
    <li>Last Login: {{ user.last_login|date:"F j, Y g:i A" }}</li>
</ul>


<a href="{% url 'admin_panel' %}">Open admin panel</a>

{% endblock %}
